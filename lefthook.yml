pre-commit:
  commands:
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: bunx oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true
