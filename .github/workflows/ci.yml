name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun ci
      - run: bun run check
      - name: Typecheck sources when present
        run: |
          if [ -n "$(git ls-files -- '*.ts' '*.tsx')" ]; then
            bun run typecheck
          else
            echo 'No TypeScript sources yet; typecheck is pending.'
          fi
      - name: Test when present
        run: |
          if [ -n "$(git ls-files -- 'src/*.ts' 'src/**/*.ts' 'src/*.tsx' 'src/**/*.tsx')" ] &&
             [ -z "$(git ls-files -- '*.test.ts' '*.spec.ts' '*.test.tsx' '*.spec.tsx')" ]; then
            echo 'TypeScript source requires tests.'
            exit 1
          fi
          if [ -n "$(git ls-files -- '*.test.ts' '*.spec.ts' '*.test.tsx' '*.spec.tsx')" ]; then
            bun run test
          else
            echo 'No tests yet; test execution is pending.'
          fi
