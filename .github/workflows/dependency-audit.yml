name: Dependency audit

on:
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".npmrc"
      - ".github/workflows/dependency-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - ".npmrc"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Audit the committed lockfile, including dev and transitive dependencies.
      # No install or lifecycle scripts are needed.
      - run: bun audit
